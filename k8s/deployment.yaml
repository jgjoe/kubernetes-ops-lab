apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-ops-lab
  namespace: kubernetes-ops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-ops-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-ops-lab
    spec:
      containers:
        - name: app
          image: kubernetes-ops-lab:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-ops-lab-config
                  key: APP_VERSION
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
